[project]
name = "ohbm2026-harmonization-course"
version = "1.0.0"
description = "OHBM 2026 Educational Course. Data harmonization for neuroscientific research: Theory, challenges, and applications."
readme = "README.md"
# pcntoolkit (Block 4) supports Python 3.11 and 3.12 only.
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Nicolás Nieto" },
    { name = "Johanna Bayer" },
    { name = "Gaurav Bhalerao" },
    { name = "Emma Prevot" },
    { name = "Jacob Turnbull" },
]
dependencies = [
    # Scientific stack
    "numpy>=2.2.6,<2.4",        # >=2.2.6 required by uniharmony, <2.4 by antspyx
    "scipy>=1.12,<1.16",        # <1.16 required by antspyx
    "pandas>=2.2,<3",
    "scikit-learn>=1.7",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
    # Neuroimaging (Blocks 1 and 4)
    "nibabel>=5.3.1",
    "antspyx>=0.6",
    # Harmonization methods
    "uniharmony>=0.0.4",        # Block 3
    "neuroCombat==0.2.12",      # Blocks 2 and 3
    # neuroHarmonize 2.5.x pins numpy<2, which conflicts with uniharmony and pcntoolkit.
    # 2.4.5 has no numpy pin and the course notebooks run with it on numpy 2.
    "neuroHarmonize==2.4.5",    # Block 2
    "pcntoolkit>=1.3",          # Block 4
    # Jupyter
    "jupyterlab>=4",
    "ipykernel>=6.29",
    "ipywidgets>=8.1.7",
]

[tool.uv]
# The course is a collection of notebooks, not an installable package.
package = false
